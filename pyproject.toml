[project]
name = "netzero"
version = "0.2.0"
description = "Watch an AI agent make Python code greener, function by function, with measured CO2."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.135",
    "uvicorn[standard]>=0.34",
    "pydantic>=2.12",
    "pydantic-settings>=2.7",
    "anthropic>=0.83",
    "codecarbon==3.2.2",
    "scipy>=1.14",
    "numpy>=2.1",
    "typer>=0.15",
    "rich>=13.9",
    "python-dotenv>=1.0",
    "psutil>=6.1",
    "psycopg[binary]>=3.2",
    "psycopg-pool>=3.2",
]

[project.scripts]
netzero = "netzero.cli:app"

[dependency-groups]
dev = [
    "pytest>=9",
    "pytest-asyncio>=1.0",
    "httpx>=0.27",
    "pandas>=2.2",
    "ruff>=0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["netzero"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "slow: benchmarks and other long-running tests",
    "e2e: full pipeline runs on the demo repo",
]
addopts = "-m 'not e2e'"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["examples", "web", "runs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]
