# Neutral config for the generated tests. The host passes `-c <this file>`,
# `--rootdir <test dir>` and `--confcutdir <test dir>`, so neither the repo's
# pytest/tox/setup.cfg settings nor its conftest.py files apply.
# importlib mode keeps the test dir off sys.path: which tree is tested is
# decided by PYTHONPATH alone, and the test file can live outside the repo.
[pytest]
addopts = -p no:cacheprovider --import-mode=importlib --tb=short
markers =
    nz_workload: the representative workload; its calls are the benchmark inputs
junit_family = xunit2
console_output_style = classic
